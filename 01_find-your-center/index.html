<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="main.css">
    <style type="text/css">
        body {
            padding: 10px;
            font-family: monospace;
            font-size: x-large;
            color: #f6f6f6;
            background-color: #030045;
        }
        
        .todo {
            color: #ffc200;
        }
        
        #hello-slap {
            background-color: #0043CE;
            border: silver 1px solid;
            padding: 10px;
            width: 320px;
            height: 200px;
            max-width: 90vw;    /* Make it responsive on small screens */
            max-height: 90vh;
            overflow: auto;     /* Add scrollbars if content exceeds box size */
        }

        /* Horizontally and vertically center an element in its parent */
        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Explanation:
               - top/left 50% places the top-left corner in the center
               - translate(-50%, -50%) moves the element back by half its size
               - the result is perfect centering */
        }

    </style>
</head>

<body>

    <h1>Find your center</h1>
    <p>Alignment is everything!</p>
    <div class="todo">
        <h2>Here is your task</h2>
        <p>I need you to center the box but not its content horizontally and vertically regardless of the browser and window resolution.</p>
    </div>

    <div id="hello-slap" class="centered">
        Hey fellas! I feel so unaligned! :/
    </div>

</body>

</html>
